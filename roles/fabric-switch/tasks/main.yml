---
- name: Get platform type
  shell: cat /etc/onl/platform
  register: platform
  changed_when: false

- name: Manage OFDPA
  include: ofdpa.yml
  when: platform.stdout in platforms.accton_switches.names or platform.stdout in platforms.quanta_switches.names

- name: Manage Accton OLT
  include: olt.yml
  when: platform.stdout in platforms.accton_olts.names

- name: Authorize SSH Key
  become: yes
  authorized_key:
    key={{ pub_ssh_key }}
    user=root
    state=present
  register: sshkey
