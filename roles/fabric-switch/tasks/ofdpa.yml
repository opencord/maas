---
- name: Verify Openflow Agent Version
  command: ofagentapp --version
  register: ofdpa_version
  changed_when: false

- name: Install OFDPA for Accton switches
  include: ofdpa-accton.yml
  when:
    - platform.stdout in platforms.accton_switches.names
    - ofdpa_version.stdout.find('3.0.5.5') == -1

- name: Install OFDPA for Quanta switches
  include: ofdpa-quanta.yml
  when:
    - platform.stdout in platforms.quanta_switches.names
    - ofdpa_version.stdout.find('3.0.5.0') == -1

- name: Utilities Scripts
  template:
    src: "{{ item }}"
    dest: /root
    owner: root
    group: root
    mode: "0755"
  with_items:
    - killit
    - connect

- name: Generate DPID
  shell: ifconfig | grep HWaddr | head -1 | awk '{ print "0x0000"$5 }' | sed s/://g
  register: dpid
  changed_when: false

- name: Ensure OFDPA Config
  set_fact:
    switch_id: "{{ dpid.stdout }}"
    controller_ip: "onos-fabric"
