---
- name: Get local username
  local_action: command whoami
  register: username_on_the_host

- name: Get local user HOME directory
  local_action: command ls -d ~
  register: userdir_on_the_host

- name: Generate key pair
  become: yes
  local_action: user name="{{username_on_the_host.stdout}}"  generate_ssh_key=yes ssh_key_bits=2048 ssh_key_comment="cord@cord.lab" ssh_key_type=rsa ssh_key_file=.ssh/cord_rsa

- name: Ensure privacy of key pair
  local_action: file path="{{userdir_on_the_host.stdout}}/.ssh/{{item}}" mode=0600
  with_items:
    - cord_rsa
    - cord_rsa.pub
